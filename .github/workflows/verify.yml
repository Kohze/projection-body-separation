name: Exact certificate verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B verify_delivery.py
      - run: python -B reproduction/verify_all.py --regenerate
      - run: python -B research/polygon-seeds/check_polygon_seed.py --check-report
      - run: python -B -m unittest discover -s research/polygon-seeds -p 'test_*.py' -v
      - run: python -B -O -m unittest discover -s research/polygon-seeds -p 'test_*.py' -v
      - run: python -B research/minimality/check_minimality.py --check-report
      - run: python -B research/minimality/check_unrestricted.py --check-report
      - run: python -B research/minimality/check_zonotope_local.py --check-report
      - run: python -m pip install -r research/minimality/requirements-all-cuts.txt
      - run: python -B research/minimality/check_all_cuts.py --check-report
      - run: python -B research/minimality/check_low_sign_hyperplanes.py --check-report
      - run: python -B -m unittest discover -s research/minimality -p 'test_*.py' -v
      - run: python -B -O -m unittest discover -s research/minimality -p 'test_*.py' -v
